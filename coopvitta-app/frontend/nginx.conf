server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 320m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # OpenObserve — ^~ evita que .js/.css caiam no cache estático do SPA
    location = /obs {
        return 301 /obs/;
    }
    location ^~ /obs/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $oo_upstream openobserve:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://$oo_upstream;
    }

    # API do backend (mesmo domínio)
    location = /api {
        return 301 /api/;
    }
    location ^~ /api/ {
        client_max_body_size 320m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_pass http://$backend_upstream;
    }

    # Legado: URLs antigas com prefixo /app/
    location = /app/api {
        return 301 /api/;
    }
    location ~ ^/app/api/(.*)$ {
        return 301 /api/$1;
    }
    location = /app/login {
        return 301 /;
    }
    location = /app {
        return 301 /;
    }
    location ~ ^/app/(.*)$ {
        return 301 /$1;
    }

    location = /login {
        return 301 /;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # SPA React na raiz (login em /)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
