# Evolution API — WhatsApp COOPVITTA (Baileys / QR Code)
# API na proxy-network (NPM + coopvitta-backend). Postgres/Redis internos.
#
# Uso:
#   cd /opt/coopvitta/infra/evolution
#   bash scripts/install.sh

services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-internal
      - proxy-network
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-evolution}
      POSTGRES_USER: ${POSTGRES_USERNAME:-evolution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evolution -d evolution']
      interval: 10s
      timeout: 5s
      retries: 8
    deploy:
      resources:
        limits:
          memory: 256M

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - evolution_redis_data:/data
    networks:
      - evolution-internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 8
    deploy:
      resources:
        limits:
          memory: 160M

networks:
  evolution-internal:
    driver: bridge
  proxy-network:
    external: true

volumes:
  evolution_instances:
  evolution_postgres_data:
  evolution_redis_data:
